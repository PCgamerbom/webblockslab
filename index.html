<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="GLASS — bio pessoal premium de NOEL com player de música, tema diurno/noturno e visual cinematográfico." />
    <meta name="theme-color" content="#7ec8ff" />
    <title>GLASS — NOEL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-theme="day">
    <canvas id="skyCanvas" aria-hidden="true"></canvas>
    <div class="atmosphere-glow" aria-hidden="true"></div>

    <button class="theme-toggle" id="themeToggleButton" type="button" aria-label="Alternar modo diurno e noturno">
      <svg id="themeIcon" class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="5.5"></circle>
        <g class="sun-rays">
          <line x1="12" y1="1.5" x2="12" y2="4.2"></line>
          <line x1="12" y1="19.8" x2="12" y2="22.5"></line>
          <line x1="1.5" y1="12" x2="4.2" y2="12"></line>
          <line x1="19.8" y1="12" x2="22.5" y2="12"></line>
          <line x1="4.1" y1="4.1" x2="5.9" y2="5.9"></line>
          <line x1="18.1" y1="18.1" x2="19.9" y2="19.9"></line>
          <line x1="4.1" y1="19.9" x2="5.9" y2="18.1"></line>
          <line x1="18.1" y1="5.9" x2="19.9" y2="4.1"></line>
        </g>
      </svg>
      <span id="themeLabel">Modo Noite</span>
    </button>

    <main class="app-shell">
      <section class="glass-card" aria-label="Perfil pessoal de NOEL">
        <div class="avatar-wrap">
          <img
            id="profileAvatar"
            class="avatar-image"
            src="https://tr.rbxcdn.com/30bf3235b29b61d3f9b23b4f5358700a/150/150/AvatarHeadshot/Png"
            alt="Avatar de NOEL"
            onerror="this.src='data:image/svg+xml;charset=utf-8,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27 x1=%270%25%27 y1=%270%25%27 x2=%27100%25%27 y2=%27100%25%27%3E%3Cstop offset=%270%25%27 stop-color=%27%232563eb%27/%3E%3Cstop offset=%27100%25%27 stop-color=%27%2338bdf8%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2750%27 fill=%27url(%23g)%27/%3E%3Ctext x=%2750%25%27 y=%2756%25%27 text-anchor=%27middle%27 font-size=%2736%27 font-family=%27Arial, sans-serif%27 font-weight=%27700%27 fill=%27white%27%3EN%3C/text%3E%3C/svg%3E'"
          />
          <span class="status-dot" aria-label="Status disponível"></span>
        </div>

        <div class="intro-block">
          <p class="eyebrow">Creator profile</p>
          <h1>NOEL</h1>
        </div>

        <p class="bio-summary">Produtor • Modelador • UGC Creator 3y+ • Builder</p>

        <div class="tag-row" aria-label="Áreas de atuação">
          <span>Glass</span>
          <span>Builds</span>
          <span>UGC</span>
          <span>Design</span>
        </div>

        <div class="action-list" aria-label="Links de contato e perfil">
          <a class="action-btn" href="https://www.roblox.com/users/2281180949/profile" target="_blank" rel="noopener noreferrer">
            <span class="btn-left">
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M18.5 24L0 18.5 5.5 0 24 5.5 18.5 24zm-8.4-11.7l1.8.5.5-1.8-1.8-.5-.5 1.8z" />
              </svg>
              <span>Perfil do Roblox</span>
            </span>
            <svg class="external-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14 5h5v5"></path>
              <path d="M10 14L19 5"></path>
              <path d="M19 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h5"></path>
            </svg>
          </a>

          <button class="action-btn" id="copyDiscordBtn" type="button" aria-label="Copiar usuário do Discord">
            <span class="btn-left">
              <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20.3 4.4c-1.7-.7-3.5-1.2-5.3-1.5-.2 0-.3.1-.4.3-.2.4-.4.8-.6 1.2-1.8-.3-3.6-.3-5.4 0-.2-.4-.4-.8-.6-1.2-.1-.2-.2-.3-.4-.3-1.8.3-3.6.8-5.3 1.5-.1 0-.2.1-.3.2-3.4 5.1-4.3 10.1-1.1 14.9.1.1.2.2.3.2 2.3 1.7 4.5 2.7 6.7 3.4.2.1.4 0 .5-.2.5-.6 1-1.4 1.4-2.1.1-.2.1-.4 0-.5-.4-.3-.7-.7-1.1-1.1-.1-.1-.1-.3 0-.4.2-.1.4-.3.7-.5.1-.1.2-.1.3 0 2.7 1.2 5.6 1.2 8.2 0 .1 0 .2 0 .3 0 .3.2.5.3.7.5.1.1.1.3 0 .4-.3.4-.6.9-1.1 1.4-.1.1-.1.3 0 .5.4.7.9 1.4 1.4 2.1.1.2.3.3.5.2 2.2-.7 4.4-1.7 6.7-3.4.2-.1.3-.2.3-.3 3.3-5.1 2.4-10.1-1.1-14.9-.1-.1-.2-.2-.3-.2zM8.1 15.7c-1.1 0-2-.9-2-2.1s.9-2.1 2-2.1c1.2 0 2.1 1 2.1 2.1s-.9 2.1-2.1 2.1zm7.8 0c-1.1 0-2-.9-2-2.1s.9-2.1 2-2.1c1.2 0 2.1 1 2.1 2.1s-.9 2.1-2.1 2.1z" />
              </svg>
              <span>Discord: noel6956</span>
            </span>
            <span class="copy-toast" id="copyToast">Copiado!</span>
          </button>
        </div>
      </section>
    </main>

    <aside class="music-player" id="musicPlayer" aria-label="Player de música">
      <div class="player-top-row">
        <div class="cover-shell">
          <img id="coverArt" src="" alt="Capa da faixa atual" />
        </div>

        <div class="track-meta">
          <span class="meta-kicker">Now playing</span>
          <h2 id="trackTitle">Glass Horizon</h2>
          <p id="trackArtist">NOEL</p>
        </div>
      </div>

      <div class="toolbar" aria-label="Controles do player">
        <button class="icon-btn small" id="shuffleBtn" type="button" aria-label="Alternar reprodução aleatória">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5"></path><path d="M4 20L21 3"></path><path d="M21 16v5h-5"></path><path d="M15 15l6 6"></path><path d="M4 4l5 5"></path></svg>
        </button>

        <button class="icon-btn" id="prevBtn" type="button" aria-label="Faixa anterior">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6v12"></path><path d="M18 6L9 12l9 6V6z"></path></svg>
        </button>

        <button class="play-toggle" id="playBtn" type="button" aria-label="Reproduzir ou pausar">
          <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5v14l11-7-11-7z"></path>
          </svg>
        </button>

        <button class="icon-btn" id="nextBtn" type="button" aria-label="Próxima faixa">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6v12"></path><path d="M6 6l9 6-9 6V6z"></path></svg>
        </button>

        <button class="icon-btn small" id="repeatBtn" type="button" aria-label="Repetição de faixa">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a7 7 0 0 1 12-5h4"></path><path d="M20 12a7 7 0 0 1-12 5H4"></path><path d="M16 3l4 2-4 2"></path><path d="M8 21l-4-2 4-2"></path></svg>
        </button>
      </div>

      <div class="progress-wrap" aria-label="Progresso da faixa">
        <span id="currentTime">0:00</span>
        <input id="progressRange" type="range" min="0" max="100" step="0.1" value="0" aria-label="Barra de progresso" />
        <span id="totalTime">0:00</span>
      </div>

      <div class="volumebox" aria-label="Volume do player">
        <button class="icon-btn small" id="muteBtn" type="button" aria-label="Silenciar ou ativar volume">
          <svg id="volumeIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"></path><path d="M16 9a4 4 0 0 1 0 6"></path><path d="M18.5 6.5a7 7 0 0 1 0 11"></path></svg>
        </button>
        <input id="volumeRange" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="Volume" />
      </div>

      <div class="playlist-shell">
        <button class="playlist-toggle" id="playlistToggle" type="button" aria-expanded="false" aria-controls="playlistList">
          <span>Playlist</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
        <div class="playlist-list" id="playlistList" aria-live="polite"></div>
      </div>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./app.js"></script>
  </body>
</html>
